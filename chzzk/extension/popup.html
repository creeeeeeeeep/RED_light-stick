<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 14px;
           font: 13px/1.6 "Malgun Gothic", system-ui, sans-serif; }
    h1 { margin: 0 0 10px; font-size: 14px; }
    fieldset { border: 1px solid #ddd; border-radius: 5px;
               padding: 10px 12px; margin: 0 0 12px; }
    legend { padding: 0 5px; color: #666; font-size: 12px; }
    label { display: block; color: #666; font-size: 11px; margin-top: 6px; }
    input { width: 100%; padding: 5px 7px; font: inherit;
            box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { font: inherit; padding: 6px 10px; cursor: pointer;
             border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    button:hover { background: #f4f4f4; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    .row button { flex: 1; }
    #send { font-weight: bold; }
    .stat { display: inline-block; padding: 1px 8px; border-radius: 10px;
            background: #eee; font-size: 11px; }
    .ok { background: #d5f0d5; }
    .no { background: #f6d5d5; }
    #log { margin-top: 10px; padding: 7px; min-height: 30px; background: #f5f5f5;
           border-radius: 4px; font-size: 11px; white-space: pre-wrap;
           word-break: break-all; color: #444; }
  </style>
</head>
<body>
  <h1>크라운 응원봉</h1>

  <fieldset>
    <legend>중계 서버</legend>
    <div>상태: <span id="conn" class="stat">확인 중</span></div>
    <label>서버 주소</label>
    <input id="serverUrl" placeholder="ws://localhost:8787/ws">
    <label>방</label>
    <input id="room" placeholder="crown-test">
    <label>토큰</label>
    <input id="token" placeholder="change-me">
    <div class="row">
      <button id="save">저장 후 재연결</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>대상 탭</legend>
    <div id="target" style="font-size:11px; color:#555; word-break:break-all;">확인 중</div>
    <div id="dispatch" style="font-size:11px; color:#555; word-break:break-all; margin-top:4px;">마지막 전달: 아직 없음</div>
    <div id="stick" style="font-size:11px; color:#555; word-break:break-all; margin-top:4px;">봉: 확인 중</div>
    <div class="row">
      <button id="pin">이 탭을 대상으로</button>
      <button id="unpin">지정 해제</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>직접 테스트 (봉 없이)</legend>
    <label>이모티콘 ID</label>
    <input id="emojiId" value="redredLight">
    <div class="row">
      <button id="add">추가</button>
      <button id="clear">비우기</button>
    </div>
    <div class="row">
      <button id="send">전송</button>
    </div>
  </fieldset>

  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
